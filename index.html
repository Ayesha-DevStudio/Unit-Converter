<!DOCTYPE html >
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" type="text/css" href="style.css">
            <title>Unit Converter</title>
        </head>
        <body>
            
            <div id="banner">
                <h1>Metric Imperial Conversion</h1>
                <input type="number" id="input-el" placeholder="0">
                <button id="btn" >Convert</button>
            </div>

            <div id="body">
                <div class="card">
                    <h3 class="card-heading">Length (Meter/Feet)</h3>
                    <p class="card-paragraph" id="length-el">1 meter = 3.28 feet</p>

                </div>

                <div class="card">
                    <h3 class="card-heading" >Volume (Liters/Gallons)</h3>
                    <p class="card-paragraph" id="volume-el">1 liter = 0.26 gallons</p>

                </div>

                <div class="card">
                    <h3 class="card-heading">Mass (Kilogram/ Pounds)</h3>
                    <p class="card-paragraph" id="mass-el">1 kg = 2.2 pounds</p>

                </div>
            </div>


            <script src="converter.js"></script>
        </body>
</html>
